name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install --global yarn@4.9.1
      - run: yarn install --immutable
      - run: yarn verify

  native-artifact:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install --global yarn@4.9.1
      - run: yarn install --immutable
      - run: yarn workspace @octocodeai/agent-core build
      - run: yarn workspace @octocodeai/agent-contracts build
      - run: yarn workspace octocode-agent build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: packages/octocode-agent/out/native
          if-no-files-found: error
          retention-days: 1

  portable-package:
    needs: native-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install --global yarn@4.9.1
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .native-artifacts
          merge-multiple: true
      - run: yarn test:pack
        env:
          OCTOCODE_AGENT_NATIVE_ARTIFACTS_DIR: ${{ github.workspace }}/.native-artifacts
          OCTOCODE_AGENT_REQUIRED_NATIVE_PLATFORMS: linux,darwin,win32
