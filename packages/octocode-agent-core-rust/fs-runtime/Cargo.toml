[package]
name = "octocode-agent-fs-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "octocode-agent-fs"
path = "../src/bin/octocode-agent-fs.rs"

[dependencies]
base64 = "0.22"
cap-std = "4.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
